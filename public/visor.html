<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Ecolam</title>
    <!-- CSS de dFlip -->
    <link href="/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #27272a; overflow: hidden; }
        #flipbook-container { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="flipbook-container"></div>

    <!-- Scripts de jQuery y dFlip -->
    <script src="/dflip/js/libs/jquery.min.js" type="text/javascript"></script>
    <script src="/dflip/js/dflip.min.js" type="text/javascript"></script>

    <script>
        // 1. Extraemos la URL del PDF desde la barra de direcciones (Ej: visor.html?pdf=/pdfs/prueba.pdf)
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('pdf');

        // 2. Iniciamos la magia de dFlip
        if(pdfUrl) {
            $(document).ready(function () {
                var options = {
                    webgl: true, // Usa aceleración de hardware controlada (evita colapsos)
                    height: '100%',
                    backgroundColor: '#27272a',
                    // Aquí habilitaremos el índice automático que lea los marcadores del PDF
                    enableOutline: true, 
                    autoEnableOutline: true 
                };
                var flipBook = $("#flipbook-container").flipBook(pdfUrl, options);
            });
        } else {
            document.getElementById('flipbook-container').innerHTML = '<h3 style="color:white; text-align:center; margin-top:20%">Error: No se encontró el documento</h3>';
        }
    </script>
</body>
</html>
